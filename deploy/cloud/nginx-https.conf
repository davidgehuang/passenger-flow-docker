server {
    listen 80 default_server;
    server_name __IP__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/passenger-acme; }
    location / { return 308 https://__IP__$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name __IP__;
    ssl_certificate /etc/letsencrypt/live/__IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
