# 先手工验证 TCR 拉取和数据库连通，再创建 Deployment；替换镜像占位符。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passenger-flow
  namespace: bh-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: passenger-flow
  template:
    metadata:
      labels:
        app: passenger-flow
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node.kubernetes.io/instance-type: eklet
      tolerations:
        - key: eks.tke.cloud.tencent.com/eklet
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 45
      volumes:
        - name: scratch
          emptyDir: {}
      containers:
        - name: passenger-flow
          image: REPLACE_TCR_REGISTRY/passenger-flow/passenger-flow-app@sha256:REPLACE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3030
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: passenger-flow-config
            - secretRef:
                name: passenger-flow-secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
